name: Build Exe

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Build Executable
      run: |
        pyinstaller --onefile --noconsole --add-data "*.jpeg;." --add-data "*.jpg;." --add-data "*.db;." main.py

    - name: Upload Artifact (.exe)
      uses: actions/upload-artifact@v4
      with:
        name: SupermarketApp-Windows
        path: dist/*.exe
